version: '3.8'

networks:
  chatter-net:
    name: chatter-net

services:
  cloudflared-chatter:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-chatter
    restart: always
    environment:
      # Token from Zero Trust -> Networks -> Tunnels, set in .env
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    command: tunnel --no-autoupdate run
    networks:
      - chatter-net
    depends_on:
      - kafka-ui-chatter