services:
  postgresql-chatter:
    image: postgres:17
    container_name: postgresql-chatter
    restart: unless-stopped
    # Logical decoding: the identity-access outbox relay (Debezium) reads the change log.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chatter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-chatter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatter-net

networks:
  chatter-net:
    name: chatter-net
    driver: bridge
