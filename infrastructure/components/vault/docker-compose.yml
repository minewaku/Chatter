networks:
  chatter-net:
    name: chatter-net
    driver: bridge

services:
  vault-chatter:
    image: hashicorp/vault:1.17.6
    container_name: vault-chatter
    environment:
      VAULT_ADDR: http://127.0.0.1:5002
      # The image entrypoint writes this to /vault/config/local.json
      VAULT_LOCAL_CONFIG: |
        {
          "listener": {
            "tcp": {
              "address": "0.0.0.0:5002",
              "tls_disable": 1
            }
          },
          "storage": {
            "file": {
              "path": "/vault/file"
            }
          },
          "ui": true
        }

    cap_add:
      - IPC_LOCK                     # prevent swapping secrets to disk
    ports:
      - "127.0.0.1:5002:5002"        # local only; Vault runs without TLS
    volumes:
      - ./data:/vault/file           # file storage backend (gitignored)
    healthcheck:
      # sealed and uninitialised Vault still count as healthy: the container is up and answering
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5002/v1/sys/health?sealedcode=200&uninitcode=200"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chatter-net
    command: server
