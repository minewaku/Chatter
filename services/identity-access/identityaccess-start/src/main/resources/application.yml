server:
  port: ${IDENTITY_ACCESS_SERVER_PORT:5001}

spring:
  application:
    name: identity-access
  config:
    import: optional:vault://
  cloud:
    vault:
      # always on: the JWT signing keys can only come from Vault, so the service does not start without it
      enabled: true
      scheme: ${VAULT_SCHEME:http}
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:5002}
      authentication: TOKEN
      token: ${VAULT_TOKEN:}
      fail-fast: false
      kv:
        enabled: true
        backend: secret
        # reads secret/identityaccess; the mail credentials are the keys mail.username and mail.password
        application-name: identityaccess
        default-context: identityaccess
  datasource:
    url: ${IDENTITY_ACCESS_DB_URL:jdbc:postgresql://localhost:5432/chatter?currentSchema=identity_access}
    username: ${IDENTITY_ACCESS_DB_USERNAME:admin}
    password: ${IDENTITY_ACCESS_DB_PASSWORD:123456}
  flyway:
    enabled: true
    schemas: identity_access
    default-schema: identity_access
    create-schemas: true
  data:
    redis:
      host: ${IDENTITY_ACCESS_REDIS_HOST:localhost}
      port: ${IDENTITY_ACCESS_REDIS_PORT:6379}
      username: ${IDENTITY_ACCESS_REDIS_USERNAME:admin}
      password: ${IDENTITY_ACCESS_REDIS_PASSWORD:123456}
      # Lettuce waits 60s per command by default, which makes a Redis outage feel like a hang
      timeout: 1s
      connect-timeout: 1s
  mail:
    host: ${IDENTITY_ACCESS_MAIL_HOST:smtp.gmail.com}
    port: ${IDENTITY_ACCESS_MAIL_PORT:465}
    # from Vault (secret/identityaccess: mail.username, mail.password); empty when Vault is not reachable
    username: ${mail.username:}
    password: ${mail.password:}
    properties:
      mail:
        smtp:
          auth: ${IDENTITY_ACCESS_MAIL_AUTH:true}
          ssl:
            enable: ${IDENTITY_ACCESS_MAIL_SSL:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # component names and status only: details stay hidden, so nothing about credentials or recipients shows
      show-components: always
      status:
        # DEGRADED (a breaker is open) must not make the whole service DOWN, so it ranks below UP in severity
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200
  health:
    mail:
      enabled: false

identity-access:
  snowflake:
    worker-id: ${IDENTITY_ACCESS_SNOWFLAKE_WORKER_ID:0}
  redis:
    key-prefix: "identity-access:"
  session:
    lifetime: P30D
    retention: P30D
  # At most max-attempts within window per subject; the window is also how long a refused subject waits.
  throttle:
    sign-in: { max-attempts: 5, window: PT15M }
    reconfirmation: { max-attempts: 5, window: PT15M }
    resend-gap: { max-attempts: 1, window: PT1M }
    resend-hourly: { max-attempts: 5, window: PT1H }
    email-change-request: { max-attempts: 3, window: PT1H }
  # A breaker opens when minimum-calls of the last window-size calls are recorded and failure-rate-percent failed.
  resilience:
    mail:
      window-size: 10
      minimum-calls: 5
      failure-rate-percent: 50
      open-duration: PT30S
      trial-calls: 2
    session-store:
      window-size: 20
      minimum-calls: 10
      failure-rate-percent: 50
      open-duration: PT10S
      trial-calls: 3
  security:
    jwt:
      # the RSA key pair is read once at start-up from Vault (secret/common/jwt/rs256: private-key, public-key); there
      # is no local setting for it. keys.backend and keys.path can move the lookup, they default to those values
      issuer: identity-access
      # written into every issued token; incoming tokens are not checked for it
      audience: chatter
      access-token-ttl: PT15M
    public-endpoints:
      - /api/v*/auth/register
      - /api/v*/auth/authenticate
      - /api/v*/auth/refresh
      - /api/v*/auth/logout
      - /api/v*/auth/verification/resend
      - /api/v*/auth/verification/confirm
      - /api/v*/users/email-change/confirm
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
    cors:
      allowed-origins: []
  verification:
    mail:
      # Gmail sends as the authenticated account, so the sender defaults to the mail username
      from: ${IDENTITY_ACCESS_MAIL_FROM:${mail.username:no-reply@chatter.local}}
      subject: Verify your Chatter email
      public-base-url: http://localhost:5001
      confirm-path: /api/v1/auth/verification/confirm
      email-change-subject: Confirm your new Chatter email
      email-change-confirm-path: /api/v1/users/email-change/confirm
